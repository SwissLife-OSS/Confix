name: Confix.Tool.Release

on:
  release:
    types: [ published ]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
      NUGET_TOKEN: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.401
      - name: Restore dependencies
        run: dotnet restore All.sln
      - name: Build
        run: dotnet build All.sln --configuration Release /p:Version=${VERSION}
      # The analyzer Confix.Options embeds is produced by the solution build above.
      - name: Pack
        run: dotnet pack All.sln --configuration Release /p:Version=${VERSION} --output ./artifacts
      - name: Push
        working-directory: ./artifacts
        run: |
          for package in Confix.Library Confix.Nuke Confix Confix.Abstractions Confix.Options; do
            dotnet nuget push "${package}.${VERSION}.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${NUGET_TOKEN}"
          done
