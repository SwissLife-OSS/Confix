name: Confix.Tool

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ./src/Confix.Tool
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.401
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build
    - name: Test
      run: dotnet test
    - name: Upload snapshot mismatches
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-mismatches-${{ matrix.os }}
        path: src/Confix.Tool/**/__mismatch__/**
        if-no-files-found: ignore

  ci-build:
    name: ci-build
    if: ${{ always() }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Verify build and test results
      env:
        BUILD_RESULT: ${{ needs.build-and-test.result }}
      run: test "$BUILD_RESULT" = "success"
